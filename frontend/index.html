<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>这是Lin's blog</title>
</head>

<body>
    <h1>欢迎来到我的网页,这是第一天的工作</h1>
    <input id="title" placeholder="请输入标题">
    <input id="content" placeholder="请输入内容">
    <button onclick="add_passage()">提交</button>
    <ul id="list"></ul>
    <button id="btn_prev" onclick="prev_page()" disabled>上一页</button> <span id="page_now">第 1 页</span> <button id="btn_next" onclick="next_page()">下一页</button>
    <script>
        let page=1
        async function next_page() {
            page+=1
            passage()   
        }
        async function prev_page() {
            page-=1
            passage()
        }
        if (!localStorage.getItem("access_token")) {
            location.href = "/login.html";
        }
        async function passage() {
            if (!localStorage.getItem("access_token")){
                return
            }
            else{const list = document.getElementById("list");
                const response = await fetch(`/passage?page=${page}&page_size=10`, {
                    method: "get",
                    headers: {
                        "content-type": "application/json",
                        "Authorization": "Bearer " + localStorage.getItem("access_token")
                    }
                })
                if (response.status === 401) { // token 过期/无效 → 踢回登录页
                    localStorage.removeItem("access_token");
                    location.href = "/login.html";
                    return;
                }
                const data = await response.json();
                list.innerHTML = ""
                for (const j of data) {
                    const li = document.createElement("li");
                    j["author"]??="佚名"
                    li.textContent = j["title"]+"|"+j["content"]+"|"+j["date"]+"|"+j["author"]+" "
                    const del = document.createElement("button")
                    del.textContent = "删除"
                    del.onclick = () => del_passage(j["id"])
                    li.appendChild(del)
                    list.appendChild(li)
                }
                // 分页按钮状态：到底/到头就禁用，防止点出空列表
                const btn_prev = document.getElementById("btn_prev")
                const btn_next = document.getElementById("btn_next")
                const page_now = document.getElementById("page_now")
                btn_prev.disabled = (page <= 1)          // 第 1 页：没有上一页
                btn_next.disabled = (data.length < 10)   // 不满一页：后面没有了
                page_now.textContent = "第 " + page + " 页"
            }
        }
        async function add_passage(){
                const title=document.getElementById("title").value
                const content=document.getElementById("content").value
                const response = await fetch("/passage_add", {
                    method: "post",
                    headers: {
                        "content-type": "application/json",
                        "Authorization": "Bearer " + localStorage.getItem("access_token")
                    },
                    body: JSON.stringify({"title":title,"content":content})
                })
                const err=await response.json()
                if (response.ok){passage()}
                else if(response.status==401){localStorage.removeItem("access_token");location.href="/login.html"}
                else if(response.status==422){alert(err.detail[0].msg)}
                else{alert("出现了些故障")}
            
        }
        async function del_passage(id){
            const response = await fetch(`/passage/${id}`, {
                method: "delete",
                headers: {"Authorization": "Bearer " + localStorage.getItem("access_token")}
            })
            if (response.ok){passage()}
            else if (response.status==401){localStorage.removeItem("access_token");location.href="/login.html"}
            else if (response.status==403){alert("不能删除别人的文章")}
            else if (response.status==404){alert("文章不存在");passage()}
            else{alert("出现了些故障")}
        }
        passage()
    </script>
</body>

</html>
